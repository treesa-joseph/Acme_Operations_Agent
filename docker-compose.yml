version: '3.8'

services:
  app:
    build: ./app
    container_name: local_app_service
    env_file:
      - .env
    volumes:
      - ./skills:/app/skills:ro
    restart: always
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
      - KEYCLOAK_ISSUER_URL=http://localhost:8080/realms/master
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080/realms/master
      - MCP_SERVER_URL=http://mcp-server:3000/sse
      - SKILLS_DIR=/app/skills
      - SLM_BASE_URL=${SLM_BASE_URL:-http://host.docker.internal:11434}
      - SLM_NAME=${SLM_NAME:-phi4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      mcp-server:
        condition: service_started

  streamlit:
    build: ./streamlit
    container_name: local_streamlit_service
    env_file:
      - .env
    restart: always
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    environment:
      - BACKEND_URL=http://app:8000
      - KEYCLOAK_URL=http://localhost:8080
    depends_on:
      - app

  postgres:
    image: postgres:15-alpine
    container_name: local_postgres_service
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: local_redis_service
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build: ./mcp-server
    container_name: local_mcp_service
    env_file:
      - .env
    restart: always
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: local_keycloak_service
    restart: always
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    command: start-dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  keycloak_data: